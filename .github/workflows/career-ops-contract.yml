name: career-ops Contract

# Runs the career-ops contract tests against a REAL career-ops checkout (#192).
#
# tests/test_merge_tracker_contract.py drives the real merge-tracker.mjs, and
# tests/test_batch_runner_contract.py drives batch-runner.sh's argument parser.
# They are the only thing that notices when upstream stops honouring what this
# repo relies on. In tests.yml they skip, because no checkout is installed
# there. Before this workflow they ran only on someone's machine, so a
# CAREER_OPS_COMMIT bump in career-ops.ref had no standing gate, and neither
# would a release. That matters because the failure they guard is silent in
# the cloud: an upstream merge-tracker that refuses our rows still exits 0, and
# the evaluations are lost with only a warning in the daily's log.
#
# Two targets, both read from career-ops.ref, which this file sources and never
# restates (tests/test_career_ops_source.py holds it to that):
#   pin    — CAREER_OPS_COMMIT, fetched exactly the way the daily fetches it.
#            This is what copies run, so it is the default for a dispatch and
#            for a caller (the release workflow, later).
#   branch — the tip of CAREER_OPS_BRANCH. The weekly schedule tests this, and
#            it answers the bump question: does upstream main still honour the
#            contract? A green run names the commit it tested in its summary as
#            a candidate CAREER_OPS_COMMIT; career-ops.ref's bare-fetch line is
#            still run by hand before it ships, since this run reached that
#            commit by a clone. A red one is the early warning, and GitHub
#            emails it to whoever last edited the cron line.
#
# A skip counts as a FAILURE here. Without that, a run that could not find its
# checkout or its npm deps would skip every contract test and come back green.
# MILLHAND_REQUIRE_CONTRACT is the switch (tests/conftest.py, REQUIRE_CONTRACT_ENV
# names it), and tests/test_contract_gate.py holds this file to it.
#
# Template-only. Every job carries `if: github.repository == ...`, because this
# file ships in every copy of the template. A copy is private, so a weekly run
# there would bill the account's 2,000 free minutes to test code the copy does
# not own. The template is public, and its minutes are free.

on:
  # A PR and a push to main test the pin: that is when the contract changes —
  # a bump of CAREER_OPS_COMMIT, or this repo's side of it (the sanitizer, the
  # merge guard, the runner flags). The weekly schedule tests the branch tip.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC; tests the branch
  workflow_dispatch:
    inputs:
      career_ops_ref:
        description: "pin (career-ops.ref's CAREER_OPS_COMMIT, what copies run) or branch (CAREER_OPS_BRANCH's tip, a candidate bump)"
        type: choice
        options: [pin, branch]
        default: pin
  workflow_call:
    inputs:
      career_ops_ref:
        description: "pin or branch; see workflow_dispatch"
        type: string
        required: false
        default: pin

permissions:
  contents: read

jobs:
  contract:
    if: github.repository == 'FrameAutomata/Millhand'
    runs-on: ubuntu-latest
    # Bounded so a hang bills 30 minutes, not GitHub's 360-minute default.
    timeout-minutes: 30
    env:
      # An input wins when there is one (a dispatch or a call — whose event is
      # the CALLER's, so the event alone cannot decide); only a real schedule,
      # which has none, tests the branch; a PR or push tests the pin. An empty
      # input counts as none, so a caller passes `pin` or `branch` literally
      # rather than forwarding an optional of its own. Read through env, never
      # interpolated into a script: a caller supplies it.
      CONTRACT_REF: ${{ inputs.career_ops_ref || (github.event_name == 'schedule' && 'branch' || 'pin') }}
    steps:
      - uses: actions/checkout@v7

      # The same majors as the daily, because that is the toolchain the
      # contract is relied on under. tests/test_contract_gate.py holds both.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch career-ops
        run: |
          . ./career-ops.ref
          # `${VAR:?}`, for the daily's reason: `git fetch <url> ""` fetches the
          # default branch and exits 0, so an empty pin would test main and
          # report it as the pin.
          : "${CAREER_OPS_URL:?career-ops.ref names no URL}"
          # The pin is fetched whichever target runs: the daily fetches it by
          # SHA, and a weekly branch run is the earliest warning that it stopped
          # being fetchable, rather than the morning the daily fails.
          : "${CAREER_OPS_COMMIT:?career-ops.ref names no pinned commit}"
          git init -q career-ops
          git -C career-ops fetch -q --depth 1 --no-tags "$CAREER_OPS_URL" "$CAREER_OPS_COMMIT"
          git -C career-ops checkout -q FETCH_HEAD
          case "$CONTRACT_REF" in
            pin) ;;
            branch)
              : "${CAREER_OPS_BRANCH:?career-ops.ref names no branch}"
              rm -rf career-ops
              git clone -q --depth 1 --branch "$CAREER_OPS_BRANCH" "$CAREER_OPS_URL" career-ops
              ;;
            *)
              echo "::error::career_ops_ref must be 'pin' or 'branch', not '$CONTRACT_REF'"
              exit 1
              ;;
          esac
          tested=$(git -C career-ops rev-parse HEAD)
          echo "career-ops ($CONTRACT_REF) at $tested"
          echo "career-ops \`$CONTRACT_REF\` at \`$tested\`" >> "$GITHUB_STEP_SUMMARY"
          echo "TESTED_SHA=$tested" >> "$GITHUB_ENV"

      - name: Install career-ops Node deps
        # --ignore-scripts, as in the daily: career-ops' postinstall downloads a
        # browser that nothing here launches. merge-tracker.mjs needs js-yaml.
        run: npm install --prefix career-ops --ignore-scripts

      - name: Run the contract tests
        env:
          CAREER_OPS_PATH: career-ops
          MILLHAND_REQUIRE_CONTRACT: '1'
        run: >-
          python -m pytest -v --tb=short
          tests/test_merge_tracker_contract.py tests/test_batch_runner_contract.py

      # Only after the tests pass, so a red run never names a candidate.
      - name: Name the candidate pin
        if: success() && env.CONTRACT_REF == 'branch'
        run: >-
          echo "Contract green at \`$TESTED_SHA\`: a candidate CAREER_OPS_COMMIT.
          Run career-ops.ref's bare-fetch line for it before it ships."
          >> "$GITHUB_STEP_SUMMARY"
