name: Tests

on:
  pull_request:
    branches: ["**"]
  # main itself, so a merge leaves a green (or red) commit behind it, and a
  # caller: the release workflow (later) runs this on the SHA it is about to
  # tag. Both are template-only; see the job's `if:`.
  push:
    branches: [main]
  workflow_call:

jobs:
  test:
    # A pull request runs this anywhere, as it always has. A push or a call runs
    # it only in the template. This file ships in every person's copy, and under
    # the roadmap's committed state (#211) a copy's daily commits to that copy's
    # main on every run, so an unguarded push trigger would bill a Windows +
    # Linux test run against the account's 2,000 free minutes every day, in
    # every copy, to re-test code the copy did not change. A skipped job bills
    # nothing.
    # tests/test_contract_gate.py holds this condition.
    if: github.event_name == 'pull_request' || github.repository == 'FrameAutomata/Millhand'
    name: "py${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    # Bounded so a hang bills 30 minutes, not GitHub's 360-minute default, against
    # the account's 2,000 free Actions minutes a month. This run installs
    # requirements + requirements-ui + requirements-dev on both legs, which is
    # minutes on wheels and could be far more if a pin ever loses its Windows
    # wheel — that would surface here as a timeout, not as a build failure.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent. On a PRIVATE repo it bills at 10x
        # (Windows 2x, Linux 1x), so on a ~2.2 min run it was 21.6 of the 28
        # billable minutes each PR cost — 77% of the spend on the platform least
        # likely to break. Every macOS-specific branch we have is already covered
        # on any host by monkeypatching sys.platform (skills.py's Terminal.app
        # launcher, notify.py's osascript), so what a macOS runner adds over
        # Linux is only the environmental difference: a case-insensitive
        # filesystem and BSD rather than GNU userland. Windows stays — it is the
        # genuinely divergent platform here (path semantics, no fork) and costs
        # a fifth as much.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install UI dependencies
        run: pip install -r requirements-ui.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
